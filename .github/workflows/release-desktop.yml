name: Release Desktop App

# Creates a clean GitHub Release containing only the desktop installers.
# - Triggered by version tags (v0.1.0, v1.2.3, ...) → full published release
# - workflow_dispatch: build artifacts always; check "publish_release" + provide version to create a (draft) GitHub Release
# - Windows x64 NSIS + unsigned macOS Apple Silicon DMG + Linux x64 DEB/AppImage builds
# - Version from tag or input is synced into tauri.conf.json + Cargo.toml before build
# - A dedicated release job collects artifacts and publishes a single clean release
# - After merging a PR, use the manual dispatch (or push a tag) to publish the setup.exe etc.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main   # builds artifacts on every merge to main (for testing). Use manual dispatch + publish_release to create a GitHub Release.
  pull_request: {}   # validate desktop build (including sidecars) on PRs
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create and publish a GitHub Release (with installers attached)"
        required: false
        default: false
        type: boolean
      version:
        description: "Version for the release (e.g. 0.2.0). Used when manually triggering."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Determine and sync release version
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -e

          # Prefer explicit input > tag > current file
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Fallback to whatever is committed (for PR/main builds and plain dispatch)
            VERSION=$(node -e '
              const fs = require("fs");
              const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
              console.log(conf.version || "0.0.0");
            ')
          fi

          echo "Using version for build: $VERSION"

          # Patch tauri.conf.json (affects the final NSIS .exe name and app metadata)
          node -e '
            const fs = require("fs");
            const p = "tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
            console.log("Patched tauri.conf.json →", process.argv[1]);
          ' "$VERSION"

          # Patch Cargo.toml (Tauri Rust side uses this)
          node -e '
            const fs = require("fs");
            let toml = fs.readFileSync("Cargo.toml", "utf8");
            const newV = process.argv[1];
            toml = toml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${newV}"`);
            fs.writeFileSync("Cargo.toml", toml);
            console.log("Patched Cargo.toml →", newV);
          ' "$VERSION"
        env:
          GITHUB_REF: ${{ github.ref }}

      # Builds the Rust native sidecars (backend + mcp_server + cli) + Tauri desktop app.
      - name: Build backend sidecar + desktop app
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run desktop:build

      - name: Smoke-test packaged backend routes
        shell: pwsh
        run: |
          $env:BEACON_PORT = "18765"
          $env:BEACON_DATA_DIR = Join-Path $env:RUNNER_TEMP "beacon-smoke"
          New-Item -ItemType Directory -Force $env:BEACON_DATA_DIR | Out-Null
          $backend = Resolve-Path "frontend/src-tauri/backend-x86_64-pc-windows-msvc.exe"
          $process = Start-Process -FilePath $backend -ArgumentList "--port", "18765" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $info = Invoke-RestMethod "http://127.0.0.1:18765/system/info"
                if ($info.api_protocol -eq 2) { $ready = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "Packaged Rust backend did not start cleanly" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare standalone Windows CLI
        shell: pwsh
        run: |
          target/release/beacon_cli.exe --version
          Copy-Item target/release/beacon_cli.exe beacon-windows-x64.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
            beacon-windows-x64.exe

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Determine and sync release version
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -e 'const c=require("./tauri.conf.json"); console.log(c.version || "0.0.0")')
          fi
          node -e '
            const fs = require("fs");
            const p = "tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"
          node -e '
            const fs = require("fs");
            const p = "Cargo.toml";
            let toml = fs.readFileSync(p, "utf8");
            toml = toml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${process.argv[1]}"`);
            fs.writeFileSync(p, toml);
          ' "$VERSION"

      - name: Build unsigned macOS app and DMG
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run desktop:build:mac

      - name: Prepare standalone macOS CLI
        run: |
          target/release/beacon_cli --version
          cp target/release/beacon_cli beacon-macos-arm64
          chmod +x beacon-macos-arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz
            frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            beacon-macos-arm64

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Determine and sync release version
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -e 'const c=require("./tauri.conf.json"); console.log(c.version || "0.0.0")')
          fi
          node -e '
            const fs = require("fs");
            const p = "tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"
          node -e '
            const fs = require("fs");
            const p = "Cargo.toml";
            let toml = fs.readFileSync(p, "utf8");
            toml = toml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${process.argv[1]}"`);
            fs.writeFileSync(p, toml);
          ' "$VERSION"

      - name: Build Linux DEB and AppImage
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run desktop:build:linux

      - name: Prepare standalone Linux CLI
        run: |
          target/release/beacon_cli --version
          cp target/release/beacon_cli beacon-linux-x64
          chmod +x beacon-linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            beacon-linux-x64

  release:
    needs: [build, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download desktop installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: beacon-*
          merge-multiple: true

      - name: Determine release version for naming
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            REL_VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REL_VER="${GITHUB_REF#refs/tags/v}"
          else
            REL_VER="${{ github.ref_name }}"
          fi
          echo "release_version=$REL_VER" >> $GITHUB_OUTPUT
          echo "Release display version: $REL_VER"

      - name: Build versioned release notes
        env:
          REL_VER: ${{ steps.ver.outputs.release_version }}
        run: |
          CHANGELOG=$(awk -v v="$REL_VER" 'index($0, "## [" v "]") == 1 {f=1; next} index($0, "## [") == 1 {f=0} f' docs/changelog.md | sed '/^\[Compare/d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See the generated commit notes below for changes in this release."
          fi
          {
            printf '## Beacon %s\n\n' "$REL_VER"
            printf '%s\n\n' "$CHANGELOG"
            printf '## Downloads\n\n'
            printf 'The desktop app includes the native Rust backend, MCP server, and Beacon CLI. No Python runtime is required.\n\n'
            printf -- '- **Windows 10/11 (x64):** download and run the `.exe`.\n'
            printf -- '- **macOS (Apple Silicon):** open the `.dmg` and drag Beacon to Applications.\n'
            printf -- '- **Linux (x64):** use the `.AppImage` or install the `.deb`.\n\n'
            printf 'Beacon is not notarized on macOS yet. If Gatekeeper blocks the first launch, run:\n\n'
            printf '```bash\nxattr -dr com.apple.quarantine /Applications/Beacon.app\n```\n\n'
            printf 'After the first install, Beacon can update itself in-app.\n'
          } > artifacts/release-notes.md

      - name: Generate updater manifest (latest.json)
        env:
          REL_VER: ${{ steps.ver.outputs.release_version }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          PLATFORMS='{}'

          add_platform() {
            local key="$1" file="$2"
            local base sig url
            base=$(basename "$file")
            sig=$(find artifacts -name "${base}.sig" | head -1)
            if [ -z "$sig" ] || [ ! -f "$sig" ]; then
              echo "::error::Missing signature for ${base} — was TAURI_SIGNING_PRIVATE_KEY set on the build job?"
              exit 1
            fi
            url="https://github.com/${REPO}/releases/download/v${REL_VER}/${base}"
            PLATFORMS=$(echo "$PLATFORMS" | jq \
              --arg k "$key" --arg s "$(cat "$sig")" --arg u "$url" \
              '. + {($k): {signature:$s, url:$u}}')
            echo "  + $key -> $base"
          }

          EXE=$(find artifacts -name '*-setup.exe' | head -1)
          [ -n "$EXE" ] && add_platform "windows-x86_64" "$EXE"

          MAC=$(find artifacts -name '*.app.tar.gz' | head -1)
          [ -n "$MAC" ] && add_platform "darwin-aarch64" "$MAC"

          LINUX=$(find artifacts -name '*.AppImage.tar.gz' | head -1)
          [ -n "$LINUX" ] && add_platform "linux-x86_64" "$LINUX"

          if [ "$PLATFORMS" = "{}" ]; then
            echo "No signed updater artifacts found — skipping latest.json."
            exit 0
          fi

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="Beacon v${REL_VER} — see https://github.com/${REPO}/releases/tag/v${REL_VER}"
          jq -n \
            --arg v "$REL_VER" --arg notes "$NOTES" --arg date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version:$v, notes:$notes, pub_date:$date, platforms:$platforms}' \
            > artifacts/latest.json
          echo "Generated latest.json:"; cat artifacts/latest.json

      - name: Publish Desktop Installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.release_version) }}
          name: Beacon ${{ steps.ver.outputs.release_version }}
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: false
          body_path: artifacts/release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/**/*.AppImage.tar.gz
            artifacts/**/beacon-macos-arm64
            artifacts/**/beacon-linux-x64
            artifacts/latest.json

      - name: Announce release to Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          REL_VER: ${{ steps.ver.outputs.release_version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK not set — skipping announce."
            exit 0
          fi
          TAG="v${REL_VER}"
          URL="https://github.com/${REPO}/releases/tag/${TAG}"
          BODY=$(awk -v v="$REL_VER" '$0 ~ ("^## \\[" v "\\]") {f=1; next} /^## \[/{f=0} f' docs/changelog.md 2>/dev/null | sed '/^\[Compare/d' | head -c 3800)
          [ -z "$BODY" ] && BODY="A new Beacon release is out — see the notes and download on GitHub."
          payload=$(jq -n \
            --arg title "🚀 Beacon ${TAG}" --arg url "$URL" \
            --arg desc "$BODY" --arg footer "Beacon • ${TAG}" \
            '{username:"Beacon Releases", embeds:[{title:$title, url:$url, description:$desc, color:5793266, footer:{text:$footer}}]}')
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -H "Content-Type: application/json" -X POST "$WEBHOOK" -d "$payload")
          echo "Discord responded: $code"; cat /tmp/resp.txt || true
          case "$code" in 2*) : ;; *) echo "::warning::Discord announce failed ($code)" ;; esac
