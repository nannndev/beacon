[package]
name = "beacon-server"
version = "0.11.0"
edition = "2021"
default-run = "beacon-server"

[dependencies]
beacon-core = { path = "../beacon-core" }
beacon-gateway = { path = "../beacon-gateway" }
beacon-agent = { path = "../beacon-agent" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# LAN project sharing: sqlite revisions, self-signed TLS identity, pinned peers.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1.0"




