[package]
name = "beacon-cli"
version = "0.11.0"
edition = "2021"

[[bin]]
name = "beacon_cli"
path = "src/main.rs"

[dependencies]
beacon-core = { path = "../beacon-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
regex = "1.10"
base64 = "0.22"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"

