[package]
name = "beacon-core"
version = "0.10.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
rand = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "cookies"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
url = "2.5"
async-trait = "0.1"
parking_lot = "0.12"

