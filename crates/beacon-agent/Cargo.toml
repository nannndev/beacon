[package]
name = "beacon-agent"
version = "0.11.0"
edition = "2021"

[dependencies]
beacon-core = { path = "../beacon-core" }
beacon-gateway = { path = "../beacon-gateway" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
async-stream = "0.3"
futures = "0.3"
uuid = { version = "1.8", features = ["v4"] }
chrono = "0.4"
tracing = "0.1"
axum = { version = "0.7", features = ["json"] }

